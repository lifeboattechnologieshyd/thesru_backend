services:
  db:
    image: postgres:17
    container_name: thesru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thesru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "7432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - thesru-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thesru-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION_NAME: ap-south-1
    command: server /data --console-address ":9001"
    ports:
      - "10000:9000"
      - "10001:9001"
    volumes:
      - minio_data:/data
    networks:
      - thesru-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  createbucket:
    image: minio/mc
    container_name: thesru-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/thesru || true;
      mc anonymous set download local/thesru;
      exit 0;
      "
    networks:
      - thesru-network

  backend:
    image: thesru-backend:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      tags:
        - thesru-backend:latest
    container_name: thesru-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "6000:8000"
    networks:
      - thesru-network

volumes:
  pgdata:
  minio_data:

networks:
  thesru-network:
    external: true