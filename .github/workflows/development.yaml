name: Development

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEVELOPMENT_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.DEVELOPMENT_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Execute script on EC2
        run: |
          ssh ${{ secrets.DEVELOPMENT_EC2_USER }}@${{ secrets.DEVELOPMENT_EC2_HOST }} << EOF
          # Commands to run on the EC2 instance
          cd thesru_backend
          git checkout development
          git pull
          docker network create thesru-network || true
          # Explicitly start ONLY deployment-required services
          docker compose -f ./deploy/compose/docker-compose.yaml up -d --build --remove-orphans minio createbucket db backend
          # Clean up dangling images to save space without breaking cache
          docker image prune -f
          EOF
