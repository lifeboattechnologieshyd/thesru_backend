name: Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_EC2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: ssh-keyscan -H ${{ secrets.PRODUCTION_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Execute script on EC2
        run: |
          ssh ${{ secrets.PRODUCTION_EC2_USER }}@${{ secrets.PRODUCTION_EC2_HOST }} << EOF
          # Commands to run on the EC2 instance
          cd thesru_backend
          git checkout main
          git pull
          docker network create thesru-network || true
          # Compose is idempotent — only recreates containers whose config changed
          sudo docker compose -f ./deploy/compose/docker-compose.yaml up -d --build --remove-orphans backend
          # Clean up dangling images to save space without breaking cache
          sudo docker image prune -f
          EOF
